<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボイスメモ文字起こし</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background: #f9f9f9; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
    h1 { font-size: 1.4rem; margin-top: 0; }
    input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
    .btn { padding: 12px 24px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-record { background: #e53e3e; color: #fff; }
    .btn-stop { background: #4a5568; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 0.9rem; color: #666; }
    .log-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
    .log-time { font-size: 0.8rem; color: #a0aec0; margin-bottom: 6px; }
    .log-text { font-size: 0.95rem; white-space: pre-wrap; }
    .copy-btn { margin-top: 8px; font-size: 0.8rem; padding: 4px 10px; border: 1px solid #cbd5e0; background: #edf2f7; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎙️ ボイスメモ文字起こし (Groq Whisper)</h1>
    
    <!-- APIキー設定（ブラウザのlocalStorageに保存されるため再入力不要） -->
    <label style="font-size:0.85rem; font-weight:bold;">Groq APIキー:</label>
    <input type="password" id="apiKey" placeholder="gsk_..." onchange="saveKey()">

    <!-- 録音ボタン類 -->
    <div>
      <button id="recordBtn" class="btn btn-record" onclick="toggleRecord()">録音開始</button>
    </div>
    <div id="status" class="status">待機中</div>
  </div>

  <h2>文字起こし履歴</h2>
  <div id="history"></div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // APIキーの読み込み
    window.onload = () => {
      const savedKey = localStorage.getItem("groq_api_key");
      if (savedKey) document.getElementById("apiKey").value = savedKey;
    };

    function saveKey() {
      const key = document.getElementById("apiKey").value.trim();
      localStorage.setItem("groq_api_key", key);
    }

    // 録音の開始・停止切り替え
    async function toggleRecord() {
      const btn = document.getElementById("recordBtn");
      const status = document.getElementById("status");
      const apiKey = document.getElementById("apiKey").value.trim();

      if (!apiKey) {
        alert("先にGroqのAPIキーを入力してください。");
        return;
      }

      if (!isRecording) {
        // 録音開始
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            await sendToGroq(audioBlob);
          };

          mediaRecorder.start();
          isRecording = true;
          btn.innerText = "■ 録音停止＆文字起こし";
          btn.className = "btn btn-stop";
          status.innerText = "🔴 録音中...";
        } catch (err) {
          alert("マイクの利用許可がありません。ブラウザの設定を確認してください。");
        }
      } else {
        // 録音停止
        mediaRecorder.stop();
        // マイクのストリームを停止
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;
        btn.innerText = "録音開始";
        btn.className = "btn btn-record";
        btn.disabled = true;
        status.innerText = "⏳ Groqで文字起こし中...";
      }
    }

    // Groq APIへ音声を送信
    async function sendToGroq(audioBlob) {
      const apiKey = document.getElementById("apiKey").value.trim();
      const status = document.getElementById("status");
      const btn = document.getElementById("recordBtn");

      const formData = new FormData();
      formData.append("file", audioBlob, "recording.webm");
      formData.append("model", "whisper-large-v3-turbo"); // 高速＆高精度モデル
      formData.append("language", "ja"); // 日本語指定

      try {
        const response = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${apiKey}` },
          body: formData
        });

        const data = await response.json();
        if (data.text) {
          addHistory(data.text);
          status.innerText = "✅ 完了しました";
        } else {
          status.innerText = "❌ エラー: " + (data.error ? data.error.message : "文字起こしに失敗しました");
        }
      } catch (err) {
        status.innerText = "❌ 通信エラーが発生しました";
      } finally {
        btn.disabled = false;
      }
    }

    // 履歴にカードを追加
    function addHistory(text) {
      const historyDiv = document.getElementById("history");
      const timeStr = new Date().toLocaleTimeString();

      const item = document.createElement("div");
      item.className = "log-item";
      item.innerHTML = `
        <div class="log-time">${timeStr}</div>
        <div class="log-text">${escapeHtml(text)}</div>
        <button class="copy-btn" onclick="navigator.clipboard.writeText(this.previousElementSibling.innerText); alert('コピーしました');">コピー</button>
      `;
      historyDiv.prepend(item); // 新しいものを上に追加
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
