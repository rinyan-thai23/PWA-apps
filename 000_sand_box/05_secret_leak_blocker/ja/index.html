<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Leak Blocker - 機密データ・マスク消去機</title>
  <meta name="description" content="ログやコードに含まれるAPIキー(OpenAI, AWS, GitHub, Stripe)、IPアドレス、メールアドレス、秘密鍵、JWT、クレカ番号を自動検知して安全にマスキング。ChatGPTやIssueへの投稿前に事故を防ぐ完全クライアントサイドツール。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111726;
      --card-border: #1e293b;
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.2);
      --accent-hover: #e11d48;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-mono: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 23, 38, 0.8);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #064e3b;
      color: #34d399;
      font-weight: 600;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .lang-link {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      transition: all 0.2s;
    }
    .lang-link:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border-color: #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    main {
      flex: 1;
      padding: 1.5rem 2rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Stats & Controls Bar */
    .controls-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .detection-summary {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .leak-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.8rem;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 9999px;
    }

    .category-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .cat-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .cat-badge span {
      color: var(--accent);
      font-weight: 700;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .mode-select {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .mode-select:focus {
      border-color: var(--accent);
    }

    /* Options Filter Row */
    .options-row {
      background: #0b0f19;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      align-items: center;
    }

    .opt-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }
    .opt-label input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Workspace Grid */
    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      flex: 1;
      min-height: 540px;
    }

    @media (max-width: 1024px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    textarea.text-area {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 480px;
      padding: 1rem;
      background: transparent;
      color: #e2e8f0;
      border: none;
      resize: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.55;
      outline: none;
      white-space: pre;
    }

    .sanitized-preview {
      flex: 1;
      padding: 1rem;
      background: #080c14;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.55;
      color: #38bdf8;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: all;
    }

    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #042f2e;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      padding: 1.25rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div>
        <div class="brand-title">Secret Leak Blocker</div>
      </div>
      <span class="brand-badge">100% Client-Side Safe</span>
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" id="btn-load-sample">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        外部テストサンプル再読込
      </button>
      <a href="../en/index.html" class="lang-link">English</a>
    </div>
  </header>

  <main>
    <!-- Controls Bar -->
    <div class="controls-bar">
      <div class="detection-summary">
        <div class="leak-pill" id="total-badge">
          <span>🛡️ 0件の機密を検知</span>
        </div>
        <div class="category-badges" id="category-badges">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="action-group">
        <label style="font-size:0.8rem; color:var(--text-muted);">置換形式:</label>
        <select class="mode-select" id="mode-select">
          <option value="mask">マスク保護 (sk-****...****)</option>
          <option value="placeholder">タグ置換 ([REDACTED_API_KEY])</option>
          <option value="simple">シンプル削除 ([REDACTED])</option>
        </select>
        <button class="btn btn-primary" id="btn-copy">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          安全なテキストをコピー
        </button>
        <button class="btn btn-secondary" id="btn-download">
          保存 (.txt)
        </button>
      </div>
    </div>

    <!-- Detection Toggles -->
    <div class="options-row">
      <label class="opt-label"><input type="checkbox" id="chk-apikey" checked> 🔑 APIキー (OpenAI/AWS/Stripe/GitHub)</label>
      <label class="opt-label"><input type="checkbox" id="chk-ip" checked> 🌐 IPアドレス (IPv4/IPv6)</label>
      <label class="opt-label"><input type="checkbox" id="chk-email" checked> 📧 メールアドレス</label>
      <label class="opt-label"><input type="checkbox" id="chk-jwt" checked> 🔐 JWT / Bearer トークン</label>
      <label class="opt-label"><input type="checkbox" id="chk-privkey" checked> 🛡️ RSA / SSH 秘密鍵ブロック</label>
      <label class="opt-label"><input type="checkbox" id="chk-card" checked> 💳 クレジットカード</label>
      <label class="opt-label"><input type="checkbox" id="chk-phone" checked> 📞 電話番号</label>
    </div>

    <!-- Workspace -->
    <div class="workspace-grid">
      <!-- Input Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            元テキスト (ログ、設定ファイル、コードを貼り付け)
          </span>
          <button class="btn btn-secondary" style="padding:2px 8px; font-size:0.75rem;" id="btn-clear">クリア</button>
        </div>
        <textarea class="text-area" id="inp-raw" placeholder="ここにログや.env、コード、JSONを貼り付けてください..."></textarea>
      </div>

      <!-- Output Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
            安全にマスキングされたテキスト (外部共有可能)
          </span>
          <span style="font-size:0.75rem; color:var(--text-muted);" id="stat-output-bytes">0 文字</span>
        </div>
        <div class="sanitized-preview" id="out-sanitized"></div>
      </div>
    </div>
  </main>

  <div id="toast">クリップボードにコピーしました！</div>

  <footer>
    <p>Secret Leak Blocker &bull; 完全静音・100%クライアントサイド処理 &bull; データはサーバーに一切送信されません</p>
  </footer>

  <script>
    const inpRaw = document.getElementById('inp-raw');
    const outSanitized = document.getElementById('out-sanitized');
    const modeSelect = document.getElementById('mode-select');
    const totalBadge = document.getElementById('total-badge');
    const catBadges = document.getElementById('category-badges');
    const statOutputBytes = document.getElementById('stat-output-bytes');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // マスキングヘルパー
    function maskText(str, mode, typeTag) {
      if (mode === 'simple') return '[REDACTED]';
      if (mode === 'placeholder') return `[REDACTED_${typeTag}]`;

      // 'mask' モード: 前後数文字を残してアスタリスク化
      if (typeTag === 'EMAIL') {
        const parts = str.split('@');
        if (parts.length === 2) {
          const user = parts[0];
          const domain = parts[1];
          const maskedUser = user.length > 2 ? user[0] + '****' + user[user.length - 1] : '****';
          return `${maskedUser}@${domain}`;
        }
      }

      if (typeTag === 'IP') {
        return str.replace(/\.\d+\.\d+$/, '.***.***');
      }

      if (typeTag === 'CARD') {
        return '****-****-****-' + str.slice(-4);
      }

      if (str.length <= 8) return '****';
      return str.substring(0, 4) + '****************' + str.substring(str.length - 4);
    }

    // コア・サニタイズ処理
    function sanitize() {
      let text = inpRaw.value;
      const mode = modeSelect.value;

      const chkApiKey = document.getElementById('chk-apikey').checked;
      const chkIp = document.getElementById('chk-ip').checked;
      const chkEmail = document.getElementById('chk-email').checked;
      const chkJwt = document.getElementById('chk-jwt').checked;
      const chkPrivKey = document.getElementById('chk-privkey').checked;
      const chkCard = document.getElementById('chk-card').checked;
      const chkPhone = document.getElementById('chk-phone').checked;

      let counts = {
        apiKeys: 0,
        ips: 0,
        emails: 0,
        jwts: 0,
        privKeys: 0,
        cards: 0,
        phones: 0
      };

      // 1. RSA / SSH 秘密鍵ブロック
      if (chkPrivKey) {
        text = text.replace(/-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----/g, (match) => {
          counts.privKeys++;
          return mode === 'placeholder' ? '[REDACTED_RSA_PRIVATE_KEY]' : '-----BEGIN PRIVATE KEY-----\n[REDACTED_KEY_BLOCK]\n-----END PRIVATE KEY-----';
        });
      }

      // 2. JWT (三段構造)
      if (chkJwt) {
        text = text.replace(/\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b/g, (match) => {
          counts.jwts++;
          return maskText(match, mode, 'JWT');
        });
      }

      // 3. APIキー・シークレット
      if (chkApiKey) {
        // OpenAI
        text = text.replace(/\bsk-(?:proj-)?[a-zA-Z0-9_\-]{20,}\b/g, (match) => {
          counts.apiKeys++;
          return maskText(match, mode, 'OPENAI_KEY');
        });
        // AWS
        text = text.replace(/\bAKIA[0-9A-Z]{16}\b/g, (match) => {
          counts.apiKeys++;
          return maskText(match, mode, 'AWS_KEY');
        });
        // AWS Secret Key in env (40 chars base64)
        text = text.replace(/(?:AWS_SECRET_ACCESS_KEY\s*[:=]\s*["']?)([A-Za-z0-9/+=]{40})(["']?)/g, (match, p1, p2) => {
          counts.apiKeys++;
          return `AWS_SECRET_ACCESS_KEY="${maskText(p1, mode, 'AWS_SECRET')}"`;
        });
        // GitHub
        text = text.replace(/\bgh[pousr]_[A-Za-z0-9_]{30,}\b/g, (match) => {
          counts.apiKeys++;
          return maskText(match, mode, 'GITHUB_TOKEN');
        });
        // Stripe
        text = text.replace(/\b(?:sk|pk)_(?:test|live)_[0-9a-zA-Z]{24,}\b/g, (match) => {
          counts.apiKeys++;
          return maskText(match, mode, 'STRIPE_KEY');
        });
        // Slack
        text = text.replace(/\bxox[baprs]-[0-9a-zA-Z-]{20,}\b/g, (match) => {
          counts.apiKeys++;
          return maskText(match, mode, 'SLACK_TOKEN');
        });
        // パスワード・シークレットURL
        text = text.replace(/(postgres(?:ql)?:\/\/[^:]+:)([^@]+)(@)/g, (match, prefix, pass, suffix) => {
          counts.apiKeys++;
          return `${prefix}${maskText(pass, mode, 'PASSWORD')}${suffix}`;
        });
      }

      // 4. クレジットカード
      if (chkCard) {
        text = text.replace(/\b(?:\d{4}[- ]){3}\d{4}\b/g, (match) => {
          counts.cards++;
          return maskText(match, mode, 'CARD');
        });
      }

      // 5. メールアドレス
      if (chkEmail) {
        text = text.replace(/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g, (match) => {
          counts.emails++;
          return maskText(match, mode, 'EMAIL');
        });
      }

      // 6. IPアドレス (IPv4)
      if (chkIp) {
        text = text.replace(/\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b/g, (match) => {
          counts.ips++;
          return maskText(match, mode, 'IP');
        });
        // IPv6
        text = text.replace(/\b(?:[A-Fa-f0-9]{1,4}:){7}[A-Fa-f0-9]{1,4}\b/g, (match) => {
          counts.ips++;
          return maskText(match, mode, 'IPV6');
        });
      }

      // 7. 電話番号 (E.164 / 国際番号対応)
      if (chkPhone) {
        text = text.replace(/(?:\+1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b/g, (match) => {
          counts.phones++;
          return maskText(match, mode, 'PHONE');
        });
      }

      // 結果反映
      outSanitized.textContent = text;
      statOutputBytes.textContent = `${text.length} 文字`;

      // 統計更新
      const totalLeaks = Object.values(counts).reduce((a, b) => a + b, 0);
      if (totalLeaks > 0) {
        totalBadge.innerHTML = `<span>🛡️ ${totalLeaks}件の機密を検知＆マスク</span>`;
      } else {
        totalBadge.innerHTML = `<span>✅ 機密情報は検知されませんでした</span>`;
      }

      // カテゴリ別バッジ
      let badgesHtml = '';
      if (counts.apiKeys > 0) badgesHtml += `<div class="cat-badge">APIキー: <span>${counts.apiKeys}</span></div>`;
      if (counts.ips > 0) badgesHtml += `<div class="cat-badge">IP: <span>${counts.ips}</span></div>`;
      if (counts.emails > 0) badgesHtml += `<div class="cat-badge">Email: <span>${counts.emails}</span></div>`;
      if (counts.privKeys > 0) badgesHtml += `<div class="cat-badge">秘密鍵: <span>${counts.privKeys}</span></div>`;
      if (counts.jwts > 0) badgesHtml += `<div class="cat-badge">JWT: <span>${counts.jwts}</span></div>`;
      if (counts.cards > 0) badgesHtml += `<div class="cat-badge">カード: <span>${counts.cards}</span></div>`;
      if (counts.phones > 0) badgesHtml += `<div class="cat-badge">電話番号: <span>${counts.phones}</span></div>`;
      catBadges.innerHTML = badgesHtml;
    }

    // イベントリスナー
    inpRaw.addEventListener('input', sanitize);
    modeSelect.addEventListener('change', sanitize);
    document.querySelectorAll('.options-row input').forEach(chk => {
      chk.addEventListener('change', sanitize);
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      inpRaw.value = '';
      sanitize();
    });

    document.getElementById('btn-copy').addEventListener('click', async () => {
      const text = outSanitized.textContent;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        showToast('安全なテキストをコピーしました！');
      } catch (e) {
        showToast('コピーに失敗しました');
      }
    });

    document.getElementById('btn-download').addEventListener('click', () => {
      const text = outSanitized.textContent;
      if (!text) return;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sanitized-log.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('ファイルをダウンロードしました！');
    });

    // 外部サンプルのロード
    async function loadSample() {
      try {
        const res = await fetch('sample.log?t=' + Date.now());
        if (res.ok) {
          const text = await res.text();
          inpRaw.value = text;
          sanitize();
          showToast('外部サンプル (sample.log) をロードしました');
        } else {
          console.error('Failed to load sample.log');
        }
      } catch (err) {
        console.error('Error fetching sample.log:', err);
      }
    }

    document.getElementById('btn-load-sample').addEventListener('click', loadSample);
    window.addEventListener('DOMContentLoaded', loadSample);
  </script>
</body>
</html>
