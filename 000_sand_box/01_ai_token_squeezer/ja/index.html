<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Token Squeezer - AIコンテキスト脱脂・トークン軽量化ツール</title>
  <meta name="description" content="AIにテキストやコードを渡す前に、意味を損なわずに無駄な空白・コメント・メタデータを削除し、トークン数とAPI費用を劇的に削減する無料Webツール。">
  <link rel="alternate" hreflang="ja" href="./" />
  <link rel="alternate" hreflang="en" href="../en/" />
  <link rel="alternate" hreflang="x-default" href="../en/" />

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #111827;
      --bg-card-alt: #1a2234;
      --border-color: #1f293d;
      --accent-color: #10b981;
    }
    body {
      background-color: var(--bg-main);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    .flag-icon {
      width: 18px;
      height: 13px;
      border-radius: 2px;
      vertical-align: middle;
      display: inline-block;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    textarea {
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b py-3 px-4 sm:px-6 sticky top-0 z-40 backdrop-blur-md" style="background-color: rgba(9, 13, 22, 0.85); border-color: var(--border-color);">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="../" class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md hover:scale-105 transition-transform" title="Language Hub">
          <i data-lucide="zap" class="w-5 h-5"></i>
        </a>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base text-white tracking-tight">AI Token Squeezer</h1>
            <span class="hidden sm:inline-flex px-2 py-0.5 text-[10px] font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">トークン脱脂機</span>
          </div>
          <p class="text-[11px] text-gray-400">AIに渡す前の不要な空白・コメント・重複を削ってトークン枠を節約</p>
        </div>
      </div>

      <!-- Action Toolbar -->
      <div class="flex items-center gap-2">
        <span class="hidden md:inline-flex text-[11px] text-gray-400 border border-zinc-800 bg-zinc-900/60 px-2.5 py-1 rounded-lg">
          🔒 100% ブラウザ内完結（通信なし）
        </span>
        <!-- Language Switcher -->
        <a href="../en/" class="px-2.5 py-1 rounded-lg text-xs font-medium border border-zinc-700 bg-zinc-800 text-gray-300 hover:text-white transition flex items-center gap-1.5" title="Switch to English">
          <svg viewBox="0 0 32 24" class="flag-icon" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="24" fill="#b22234"/><path d="M0 1.85h32v1.85H0zm0 3.69h32v1.85H0zm0 3.69h32v1.85H0zm0 3.69h32v1.85H0zm0 3.69h32v1.85H0zm0 3.69h32v1.85H0z" fill="#ffffff"/><rect width="14" height="13" fill="#3c3b6e"/></svg>
          <span>EN</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 flex flex-col gap-6">

    <!-- Top Metrics Meter Card -->
    <div class="p-4 sm:p-5 rounded-2xl border flex flex-col md:flex-row items-center justify-between gap-4 shadow-lg transition-all" style="background-color: var(--bg-card); border-color: var(--border-color);">
      <div class="flex items-center gap-4 w-full md:w-auto justify-around md:justify-start">
        <div class="text-center md:text-left">
          <div class="text-xs text-gray-400 font-medium">脱脂前トークン</div>
          <div class="text-xl sm:text-2xl font-black text-gray-300 font-mono" id="beforeTokens">0</div>
          <div class="text-[10px] text-gray-500" id="beforeChars">0 文字</div>
        </div>
        <div class="text-gray-600 font-bold text-xl">→</div>
        <div class="text-center md:text-left">
          <div class="text-xs text-emerald-400 font-medium">脱脂後トークン</div>
          <div class="text-xl sm:text-2xl font-black text-emerald-400 font-mono" id="afterTokens">0</div>
          <div class="text-[10px] text-emerald-500/80" id="afterChars">0 文字</div>
        </div>
      </div>

      <!-- Saved Rate Progress Bar -->
      <div class="flex-1 w-full max-w-md flex flex-col gap-1.5">
        <div class="flex justify-between items-center text-xs">
          <span class="text-gray-400 font-semibold">トークン削減率:</span>
          <span class="font-extrabold text-emerald-400 font-mono text-sm" id="savedRate">0% Saved</span>
        </div>
        <div class="w-full h-3 rounded-full bg-zinc-800 overflow-hidden border border-zinc-700 p-0.5">
          <div id="progressBar" class="h-full rounded-full bg-gradient-to-r from-emerald-500 to-teal-400 transition-all duration-300 w-0"></div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2 w-full md:w-auto justify-end">
        <button id="copyBtn" onclick="copyOutput()" class="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1.5 shadow-md active:scale-95">
          <i data-lucide="copy" class="w-4 h-4"></i>
          <span id="copyBtnText">脱脂テキストをコピー</span>
        </button>
        <button onclick="clearAll()" class="p-2 rounded-xl text-xs text-gray-400 hover:text-red-400 hover:bg-red-500/10 border border-transparent hover:border-red-500/20 transition" title="全クリア">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Optimization Toggles (Squeeze Options) -->
    <div class="p-3.5 rounded-xl border flex flex-wrap items-center gap-x-5 gap-y-2 text-xs" style="background-color: var(--bg-card-alt); border-color: var(--border-color);">
      <span class="font-bold text-gray-300 flex items-center gap-1">
        <i data-lucide="sliders" class="w-3.5 h-3.5 text-emerald-400"></i> 脱脂オプション:
      </span>
      <label class="flex items-center gap-1.5 cursor-pointer text-gray-300 hover:text-white">
        <input type="checkbox" id="optCollapseSpaces" checked onchange="squeeze()" class="accent-emerald-500 rounded">
        <span>重複空白・空行の圧縮</span>
      </label>
      <label class="flex items-center gap-1.5 cursor-pointer text-gray-300 hover:text-white">
        <input type="checkbox" id="optTrimLines" checked onchange="squeeze()" class="accent-emerald-500 rounded">
        <span>行頭・行末の不要トリム</span>
      </label>
      <label class="flex items-center gap-1.5 cursor-pointer text-gray-300 hover:text-white">
        <input type="checkbox" id="optRemoveComments" checked onchange="squeeze()" class="accent-emerald-500 rounded">
        <span>ソースコード等のコメント削除 (//, /* */, #)</span>
      </label>
      <label class="flex items-center gap-1.5 cursor-pointer text-gray-300 hover:text-white">
        <input type="checkbox" id="optMinifyJson" onchange="squeeze()" class="accent-emerald-500 rounded">
        <span>JSON最小化 (Minify)</span>
      </label>
      <button onclick="loadSample()" class="ml-auto text-emerald-400 hover:underline text-[11px] font-semibold flex items-center gap-1">
        💡 サンプル文章を試す
      </button>
    </div>

    <!-- 2-Column Split Input/Output Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 flex-1">
      
      <!-- Input Column -->
      <div class="flex flex-col rounded-2xl border p-4 shadow-sm" style="background-color: var(--bg-card); border-color: var(--border-color);">
        <div class="flex items-center justify-between mb-2">
          <label for="inputText" class="font-bold text-xs text-gray-300 flex items-center gap-1.5">
            <i data-lucide="file-input" class="w-4 h-4 text-gray-400"></i>
            入力テキスト（貼付け または ファイルをD&D）
          </label>
          <button onclick="pasteClipboard()" class="text-xs text-emerald-400 hover:underline flex items-center gap-1">
            <i data-lucide="clipboard" class="w-3.5 h-3.5"></i> 貼付け
          </button>
        </div>
        <textarea id="inputText" oninput="squeeze()" placeholder="AIに投げたい長大なテキスト、プロンプト、ログ、コード、JSONをここにペーストまたはファイルをドラッグ＆ドロップしてください..." class="flex-1 w-full p-3.5 rounded-xl bg-zinc-950/70 border border-zinc-800 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition resize-none min-h-[340px] font-mono leading-relaxed"></textarea>
      </div>

      <!-- Output Column -->
      <div class="flex flex-col rounded-2xl border p-4 shadow-sm" style="background-color: var(--bg-card); border-color: var(--border-color);">
        <div class="flex items-center justify-between mb-2">
          <label for="outputText" class="font-bold text-xs text-emerald-400 flex items-center gap-1.5">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
            脱脂完了テキスト（このままAIに送信可能）
          </label>
          <span class="text-[11px] text-gray-400 font-mono" id="outputStats">0 tokens</span>
        </div>
        <textarea id="outputText" readonly placeholder="脱脂されたクリーンなテキストがここにリアルタイム出力されます..." class="flex-1 w-full p-3.5 rounded-xl bg-zinc-950/40 border border-zinc-800 text-sm text-emerald-200/90 placeholder-gray-600 focus:outline-none transition resize-none min-h-[340px] font-mono leading-relaxed"></textarea>
      </div>

    </div>

  </main>

  <script>
    // Estimate tokens (Approx 1 token ≈ 4 chars for English/code, ~1-2 chars for CJK)
    function estimateTokens(text) {
      if (!text) return 0;
      // Count cjk characters
      const cjk = (text.match(/[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/g) || []).length;
      const other = text.length - cjk;
      return Math.round((cjk * 1.3) + (other / 3.8));
    }

    function squeeze() {
      const input = document.getElementById('inputText').value;
      if (!input.trim()) {
        document.getElementById('outputText').value = '';
        updateMetrics(0, 0, 0, 0);
        return;
      }

      let result = input;

      const optTrimLines = document.getElementById('optTrimLines').checked;
      const optCollapseSpaces = document.getElementById('optCollapseSpaces').checked;
      const optRemoveComments = document.getElementById('optRemoveComments').checked;
      const optMinifyJson = document.getElementById('optMinifyJson').checked;

      // 1. Minify JSON if valid
      if (optMinifyJson) {
        try {
          const parsed = JSON.parse(result);
          result = JSON.stringify(parsed);
        } catch (e) {
          // Not pure JSON, proceed with normal rules
        }
      }

      // 2. Remove comments
      if (optRemoveComments) {
        // Multi-line comments /* ... */
        result = result.replace(/\/\*[\s\S]*?\*\//g, '');
        // Single line comments // ... or # ...
        result = result.replace(/(^|\s)\/\/[^\n]*/g, '');
        result = result.replace(/(^|\s)#[^\n]*/g, '');
        // HTML/XML comments <!-- ... -->
        result = result.replace(/<!--[\s\S]*?-->/g, '');
      }

      // 3. Trim lines
      if (optTrimLines) {
        result = result.split('\n').map(line => line.trim()).join('\n');
      }

      // 4. Collapse excessive whitespace and blank lines
      if (optCollapseSpaces) {
        // Replace 3+ consecutive newlines with 1
        result = result.replace(/\n{3,}/g, '\n\n');
        // Replace multiple horizontal spaces with single space
        result = result.replace(/[ \t]{2,}/g, ' ');
        result = result.trim();
      }

      document.getElementById('outputText').value = result;

      const beforeTokens = estimateTokens(input);
      const afterTokens = estimateTokens(result);
      updateMetrics(beforeTokens, afterTokens, input.length, result.length);
    }

    function updateMetrics(beforeTok, afterTok, beforeLen, afterLen) {
      document.getElementById('beforeTokens').innerText = beforeTok.toLocaleString();
      document.getElementById('afterTokens').innerText = afterTok.toLocaleString();
      document.getElementById('beforeChars').innerText = `${beforeLen.toLocaleString()} 文字`;
      document.getElementById('afterChars').innerText = `${afterLen.toLocaleString()} 文字`;
      document.getElementById('outputStats').innerText = `${afterTok.toLocaleString()} tokens`;

      if (beforeTok > 0) {
        const saved = Math.max(0, beforeTok - afterTok);
        const rate = Math.round((saved / beforeTok) * 100);
        document.getElementById('savedRate').innerText = `${rate}% 削減 (${saved.toLocaleString()} tokens)`;
        document.getElementById('progressBar').style.width = `${rate}%`;
      } else {
        document.getElementById('savedRate').innerText = '0% Saved';
        document.getElementById('progressBar').style.width = '0%';
      }
    }

    async function copyOutput() {
      const output = document.getElementById('outputText').value;
      if (!output) return;
      await navigator.clipboard.writeText(output);
      const textSpan = document.getElementById('copyBtnText');
      textSpan.innerText = 'コピー完了!';
      setTimeout(() => { textSpan.innerText = '脱脂テキストをコピー'; }, 1500);
    }

    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('inputText').value = text;
          squeeze();
        }
      } catch (err) {
        alert('クリップボードの読み取り許可が必要です。');
      }
    }

    function clearAll() {
      document.getElementById('inputText').value = '';
      document.getElementById('outputText').value = '';
      squeeze();
    }

    async function loadSample() {
      try {
        const res = await fetch('./sample.txt');
        if (res.ok) {
          const sample = await res.text();
          document.getElementById('inputText').value = sample;
          document.getElementById('optRemoveComments').checked = true;
          squeeze();
          return;
        }
      } catch (e) {
        console.warn("Could not fetch sample.txt, using fallback", e);
      }
      // Fallback sample if fetch fails (e.g. file:// protocol)
      document.getElementById('inputText').value = `// Sample module
function test() {
    /* comment */
    console.log("ready");
}`;
      squeeze();
    }

    // Drag and Drop files
    const inputArea = document.getElementById('inputText');
    inputArea.addEventListener('dragover', (e) => { e.preventDefault(); inputArea.classList.add('border-emerald-500'); });
    inputArea.addEventListener('dragleave', () => { inputArea.classList.remove('border-emerald-500'); });
    inputArea.addEventListener('drop', (e) => {
      e.preventDefault();
      inputArea.classList.remove('border-emerald-500');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const reader = new FileReader();
        reader.onload = (event) => {
          inputArea.value = event.target.result;
          squeeze();
        };
        reader.readAsText(files[0]);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadSample();
    });
  </script>
</body>
</html>
