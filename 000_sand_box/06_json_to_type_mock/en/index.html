<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON to Type & Mock - Fast TypeScript Interfaces & Mock Generator</title>
  <meta name="description" content="Generate clean TypeScript types/interfaces, Zod validation schemas, and realistic mock JSON data from raw JSON in 1ms. 100% private in-browser utility.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111726;
      --card-border: #1e293b;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --accent-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-mono: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 23, 38, 0.8);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #064e3b;
      color: #34d399;
      font-weight: 600;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .lang-link {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      transition: all 0.2s;
    }
    .lang-link:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border-color: #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    main {
      flex: 1;
      padding: 1.5rem 2rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .config-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .config-inputs {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .config-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    .input-text {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      padding: 0.35rem 0.65rem;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      outline: none;
    }
    .input-text:focus { border-color: var(--accent); }

    .opt-label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }
    .opt-label input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      flex: 1;
      min-height: 560px;
    }

    @media (max-width: 1024px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    textarea.code-editor {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 480px;
      padding: 1rem;
      background: transparent;
      color: #e2e8f0;
      border: none;
      resize: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.5;
      outline: none;
      white-space: pre;
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border-top: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.5rem 1rem;
      color: #f87171;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      display: none;
    }

    .output-tabs {
      display: flex;
      gap: 0.25rem;
    }

    .tab-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: #1e293b;
      color: var(--accent);
      border-color: #334155;
    }

    .output-code-area {
      flex: 1;
      padding: 1rem;
      background: #080c14;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.55;
      color: #38bdf8;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: all;
    }

    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #042f2e;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      padding: 1.25rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <div>
        <div class="brand-title">JSON to Type & Mock</div>
      </div>
      <span class="brand-badge">100% Client-Side Safe</span>
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" id="btn-load-sample">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Reload Sample JSON
      </button>
      <a href="../ja/index.html" class="lang-link">日本語</a>
    </div>
  </header>

  <main>
    <div class="config-bar">
      <div class="config-inputs">
        <div class="config-item">
          <label for="inp-root-name">Root Type Name:</label>
          <input type="text" id="inp-root-name" class="input-text" value="ApiResponse" style="width: 140px;">
        </div>

        <label class="opt-label">
          <input type="checkbox" id="chk-readonly"> readonly modifier
        </label>
        <label class="opt-label">
          <input type="checkbox" id="chk-type-alias"> use type alias instead of interface
        </label>
        <label class="opt-label">
          <input type="checkbox" id="chk-export" checked> export keyword
        </label>
      </div>

      <div style="display:flex; gap:0.5rem;">
        <button class="btn btn-secondary" id="btn-format">Format JSON</button>
        <button class="btn btn-primary" id="btn-copy">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy Code
        </button>
      </div>
    </div>

    <div class="workspace-grid">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            Source JSON (Paste API payload or webhook)
          </span>
          <button class="btn btn-secondary" style="padding:2px 8px; font-size:0.75rem;" id="btn-clear">Clear</button>
        </div>
        <textarea class="code-editor" id="inp-json" placeholder="Paste your raw JSON response here..."></textarea>
        <div class="error-banner" id="error-banner"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div class="output-tabs">
            <button class="tab-btn active" data-tab="ts">TypeScript</button>
            <button class="tab-btn" data-tab="zod">Zod Schema</button>
            <button class="tab-btn" data-tab="mock">Mock JSON (3 items)</button>
          </div>
          <span style="font-size:0.75rem; color:var(--text-muted);" id="stat-type-count">Types Generated</span>
        </div>
        <div class="output-code-area" id="out-code"></div>
      </div>
    </div>
  </main>

  <div id="toast">Copied code to clipboard!</div>

  <footer>
    <p>JSON to Type & Mock &bull; 100% Client-Side Execution &bull; Zero Server Tracking</p>
  </footer>

  <script>
    let currentTab = 'ts';
    const inpJson = document.getElementById('inp-json');
    const inpRootName = document.getElementById('inp-root-name');
    const chkReadonly = document.getElementById('chk-readonly');
    const chkTypeAlias = document.getElementById('chk-type-alias');
    const chkExport = document.getElementById('chk-export');
    const errorBanner = document.getElementById('error-banner');
    const outCode = document.getElementById('out-code');
    const statTypeCount = document.getElementById('stat-type-count');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function capitalize(str) {
      if (!str) return 'Type';
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function generateTypeScript(obj, rootName, isReadonly, useTypeAlias, useExport) {
      const interfaces = [];

      function walk(val, keyName) {
        if (val === null) return 'null';
        if (val === undefined) return 'undefined';
        if (typeof val === 'string') return 'string';
        if (typeof val === 'number') return 'number';
        if (typeof val === 'boolean') return 'boolean';

        if (Array.isArray(val)) {
          if (val.length === 0) return 'any[]';
          const elemType = walk(val[0], keyName ? keyName.replace(/s$/, '') : 'Item');
          return elemType.includes(' ') ? `(${elemType})[]` : `${elemType}[]`;
        }

        if (typeof val === 'object') {
          const typeName = capitalize(keyName || 'Item');
          const prefix = isReadonly ? 'readonly ' : '';
          const lines = [];

          for (const [k, v] of Object.entries(val)) {
            const safeKey = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k) ? k : JSON.stringify(k);
            const propType = walk(v, k);
            lines.push(`  ${prefix}${safeKey}: ${propType};`);
          }

          const exp = useExport ? 'export ' : '';
          let decl = '';
          if (useTypeAlias) {
            decl = `${exp}type ${typeName} = {\n${lines.join('\n')}\n};`;
          } else {
            decl = `${exp}interface ${typeName} {\n${lines.join('\n')}\n}`;
          }

          interfaces.push(decl);
          return typeName;
        }

        return 'any';
      }

      walk(obj, rootName);
      return interfaces.reverse().join('\n\n');
    }

    function generateZod(obj, rootName, useExport) {
      const schemas = [];

      function walkZod(val, keyName) {
        if (val === null) return 'z.null()';
        if (val === undefined) return 'z.undefined()';
        if (typeof val === 'string') return 'z.string()';
        if (typeof val === 'number') return 'z.number()';
        if (typeof val === 'boolean') return 'z.boolean()';

        if (Array.isArray(val)) {
          if (val.length === 0) return 'z.array(z.any())';
          const elemType = walkZod(val[0], keyName ? keyName.replace(/s$/, '') : 'Item');
          return `z.array(${elemType})`;
        }

        if (typeof val === 'object') {
          const schemaName = capitalize(keyName || 'Item') + 'Schema';
          const lines = [];

          for (const [k, v] of Object.entries(val)) {
            const safeKey = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k) ? k : JSON.stringify(k);
            const propSchema = walkZod(v, k);
            lines.push(`  ${safeKey}: ${propSchema},`);
          }

          const exp = useExport ? 'export ' : '';
          const decl = `${exp}const ${schemaName} = z.object({\n${lines.join('\n')}\n});`;
          schemas.push(decl);
          return schemaName;
        }

        return 'z.any()';
      }

      walkZod(obj, rootName);
      const code = `import { z } from "zod";\n\n` + schemas.reverse().join('\n\n') +
        `\n\n${useExport ? 'export ' : ''}type ${capitalize(rootName)} = z.infer<typeof ${capitalize(rootName)}Schema>;`;
      return code;
    }

    function generateMockArray(obj, count = 3) {
      function mockValue(val, keyName, index) {
        if (val === null) return null;
        if (typeof val === 'string') {
          if (/email/i.test(keyName)) return `test.user${index + 1}@mock-api.dev`;
          if (/id|sku|code/i.test(keyName)) return `${val}_mock_${index + 1}`;
          if (/name/i.test(keyName)) return `Mock Item ${index + 1}`;
          if (/date|at/i.test(keyName)) return new Date(Date.now() - index * 86400000).toISOString();
          return `${val} (Mock ${index + 1})`;
        }
        if (typeof val === 'number') {
          return typeof val === 'number' && Number.isInteger(val) ? val + index : parseFloat((val * (1 + index * 0.1)).toFixed(2));
        }
        if (typeof val === 'boolean') {
          return index % 2 === 0 ? val : !val;
        }
        if (Array.isArray(val)) {
          if (val.length === 0) return [];
          return [mockValue(val[0], keyName, index)];
        }
        if (typeof val === 'object') {
          const res = {};
          for (const [k, v] of Object.entries(val)) {
            res[k] = mockValue(v, k, index);
          }
          return res;
        }
        return val;
      }

      const mocks = [];
      for (let i = 0; i < count; i++) {
        mocks.push(mockValue(obj, 'root', i));
      }
      return JSON.stringify(mocks, null, 2);
    }

    function updateOutputs() {
      const raw = inpJson.value.trim();
      if (!raw) {
        outCode.textContent = '// Paste JSON to generate code';
        errorBanner.style.display = 'none';
        return;
      }

      let parsed;
      try {
        parsed = JSON.parse(raw);
        errorBanner.style.display = 'none';
      } catch (err) {
        errorBanner.textContent = 'JSON Syntax Error: ' + err.message;
        errorBanner.style.display = 'block';
        return;
      }

      const rootName = inpRootName.value.trim() || 'ApiResponse';
      const isReadonly = chkReadonly.checked;
      const useTypeAlias = chkTypeAlias.checked;
      const useExport = chkExport.checked;

      if (currentTab === 'ts') {
        outCode.textContent = generateTypeScript(parsed, rootName, isReadonly, useTypeAlias, useExport);
      } else if (currentTab === 'zod') {
        outCode.textContent = generateZod(parsed, rootName, useExport);
      } else if (currentTab === 'mock') {
        outCode.textContent = generateMockArray(parsed, 3);
      }
    }

    inpJson.addEventListener('input', updateOutputs);
    inpRootName.addEventListener('input', updateOutputs);
    [chkReadonly, chkTypeAlias, chkExport].forEach(el => el.addEventListener('change', updateOutputs));

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        updateOutputs();
      });
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      inpJson.value = '';
      updateOutputs();
    });

    document.getElementById('btn-format').addEventListener('click', () => {
      try {
        const parsed = JSON.parse(inpJson.value);
        inpJson.value = JSON.stringify(parsed, null, 2);
        updateOutputs();
        showToast('Formatted JSON');
      } catch (e) {
        showToast('Invalid JSON');
      }
    });

    document.getElementById('btn-copy').addEventListener('click', async () => {
      const text = outCode.textContent;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        showToast('Copied code to clipboard!');
      } catch (e) {
        showToast('Failed to copy');
      }
    });

    async function loadSample() {
      try {
        const res = await fetch('sample.json?t=' + Date.now());
        if (res.ok) {
          const text = await res.text();
          inpJson.value = text;
          updateOutputs();
          showToast('Sample JSON (sample.json) loaded');
        } else {
          console.error('Failed to load sample.json');
        }
      } catch (err) {
        console.error('Error fetching sample.json:', err);
      }
    }

    document.getElementById('btn-load-sample').addEventListener('click', loadSample);
    window.addEventListener('DOMContentLoaded', loadSample);
  </script>
</body>
</html>
