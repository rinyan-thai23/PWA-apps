<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Table Shaper - 超速マークダウン表整形＆スプレッドシート相互変換</title>
  <meta name="description" content="ガタガタなMarkdown表の余白パディングを自動整形。Excelやスプレッドシート(TSV/CSV)からの表生成、HTMLやJSONへの相互変換を1ミリ秒で行う完全クライアントサイドツール。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111726;
      --card-border: #1e293b;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.2);
      --accent-hover: #d97706;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-mono: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 23, 38, 0.8);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #064e3b;
      color: #34d399;
      font-weight: 600;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .lang-link {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      transition: all 0.2s;
    }
    .lang-link:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border-color: #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    main {
      flex: 1;
      padding: 1.5rem 2rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Preset Samples Toolbar */
    .preset-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .preset-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .preset-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .preset-btn {
      background: #0b0f19;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .preset-btn:hover {
      border-color: var(--accent);
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.08);
    }

    .align-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    .align-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.78rem;
    }
    .align-btn.active {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--accent);
      color: #fbbf24;
      font-weight: 700;
    }

    /* Workspace Grid */
    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      flex: 1;
      min-height: 520px;
    }

    @media (max-width: 1024px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    textarea.code-editor {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 480px;
      padding: 1rem;
      background: transparent;
      color: #e2e8f0;
      border: none;
      resize: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.5;
      outline: none;
      white-space: pre;
    }

    /* Output Tabs */
    .output-tabs {
      display: flex;
      gap: 0.25rem;
    }

    .tab-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: #1e293b;
      color: var(--accent);
      border-color: #334155;
    }

    .output-code-area {
      flex: 1;
      padding: 1rem;
      background: #080c14;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.5;
      color: #fbbf24;
      overflow: auto;
      white-space: pre;
      user-select: all;
    }

    /* Live HTML Table Preview */
    .preview-table-container {
      flex: 1;
      padding: 1rem;
      background: #080c14;
      overflow: auto;
      display: none;
    }

    .preview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      color: #e2e8f0;
    }
    .preview-table th, .preview-table td {
      border: 1px solid #334155;
      padding: 0.6rem 0.85rem;
    }
    .preview-table th {
      background: #1e293b;
      font-weight: 600;
      color: #38bdf8;
    }
    .preview-table tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #042f2e;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      padding: 1.25rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="3" y1="15" x2="21" y2="15"></line>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </div>
      <div>
        <div class="brand-title">Markdown Table Shaper</div>
      </div>
      <span class="brand-badge">100% Client-Side Safe</span>
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" id="btn-load-sample">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        外部テストサンプル再読込
      </button>
      <a href="../en/index.html" class="lang-link">English</a>
    </div>
  </header>

  <main>
    <!-- Preset Samples & Alignment Bar (一目でわかる入力形式ボタン) -->
    <div class="preset-bar">
      <div class="preset-group">
        <span class="preset-label">💡 クイック入力サンプル:</span>
        <button class="preset-btn" id="btn-sample-shabby">📊 ガタガタのMarkdown表</button>
        <button class="preset-btn" id="btn-sample-tsv">📑 スプレッドシート (TSV)</button>
        <button class="preset-btn" id="btn-sample-csv">📄 カンマ区切り (CSV)</button>
      </div>

      <div class="align-group">
        <span>整列:</span>
        <button class="align-btn active" data-align="left">:--- (左)</button>
        <button class="align-btn" data-align="center">:---: (中央)</button>
        <button class="align-btn" data-align="right">---: (右)</button>
      </div>
    </div>

    <!-- Workspace -->
    <div class="workspace-grid">
      <!-- Input Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            元データ入力 (Markdown表、TSV、CSVをそのまま貼り付け)
          </span>
          <button class="btn btn-secondary" style="padding:2px 8px; font-size:0.75rem;" id="btn-clear">クリア</button>
        </div>
        <textarea class="code-editor" id="inp-table" placeholder="| 列1 | 列2 | または&#10;スプレッドシートからコピーしたタブ区切りテキスト、&#10;CSVテキストをここに貼り付けてください..."></textarea>
      </div>

      <!-- Output Panel -->
      <div class="panel">
        <div class="panel-header">
          <div class="output-tabs">
            <button class="tab-btn active" data-tab="md">整形Markdown</button>
            <button class="tab-btn" data-tab="preview">プレビュー表示</button>
            <button class="tab-btn" data-tab="csv">CSV</button>
            <button class="tab-btn" data-tab="tsv">TSV</button>
            <button class="tab-btn" data-tab="json">JSON</button>
          </div>
          <button class="btn btn-primary" style="padding:0.3rem 0.75rem; font-size:0.8rem;" id="btn-copy">
            コピー
          </button>
        </div>

        <div class="output-code-area" id="out-code"></div>
        <div class="preview-table-container" id="preview-container">
          <table class="preview-table" id="preview-table"></table>
        </div>
      </div>
    </div>
  </main>

  <div id="toast">クリップボードにコピーしました！</div>

  <footer>
    <p>Markdown Table Shaper &bull; 完全静音・100%クライアントサイド処理 &bull; データはサーバーに一切送信されません</p>
  </footer>

  <script>
    let currentAlign = 'left';
    let currentTab = 'md';

    const inpTable = document.getElementById('inp-table');
    const outCode = document.getElementById('out-code');
    const previewContainer = document.getElementById('preview-container');
    const previewTable = document.getElementById('preview-table');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // 全角半角を考慮した表示文字幅計算
    function getVisualWidth(str) {
      let width = 0;
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i);
        // 全角文字・絵文字等の幅判定
        if ((code >= 0x3000 && code <= 0x9FFF) || (code >= 0xFF01 && code <= 0xFF60)) {
          width += 2;
        } else {
          width += 1;
        }
      }
      return width;
    }

    function padRightVisual(str, targetWidth) {
      const currentWidth = getVisualWidth(str);
      const diff = targetWidth - currentWidth;
      return diff > 0 ? str + ' '.repeat(diff) : str;
    }

    function padCenterVisual(str, targetWidth) {
      const currentWidth = getVisualWidth(str);
      const diff = targetWidth - currentWidth;
      if (diff <= 0) return str;
      const leftPad = Math.floor(diff / 2);
      const rightPad = diff - leftPad;
      return ' '.repeat(leftPad) + str + ' '.repeat(rightPad);
    }

    // 入力テキストを 2次元配列 (rows) にパース
    function parseInput(raw) {
      if (!raw || !raw.trim()) return [];

      const lines = raw.trim().split(/\r?\n/).filter(l => l.trim() !== '');
      if (lines.length === 0) return [];

      // 1. Markdown テーブル判定 (パイプ | を含む行)
      if (lines.some(l => l.includes('|'))) {
        const rows = [];
        for (let line of lines) {
          // 区切り行 (|---|---|) はスキップ
          if (/^\s*\|?\s*:?-+:?\s*(\|?\s*:?-+:?\s*)+\|?\s*$/.test(line)) {
            continue;
          }
          let clean = line.trim();
          if (clean.startsWith('|')) clean = clean.substring(1);
          if (clean.endsWith('|')) clean = clean.substring(0, clean.length - 1);

          const cells = clean.split('|').map(c => c.trim());
          rows.push(cells);
        }
        return rows;
      }

      // 2. TSV (タブ区切り)
      if (lines[0].includes('\t')) {
        return lines.map(line => line.split('\t').map(c => c.trim()));
      }

      // 3. CSV (カンマ区切り)
      return lines.map(line => {
        // 簡易CSVパース (引用符考慮)
        const re = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*|(?:\n|$))/g;
        const row = [];
        let match;
        while ((match = re.exec(line)) !== null && match[0].length > 0) {
          let cell = match[1] || '';
          if (cell.startsWith('"') && cell.endsWith('"')) {
            cell = cell.slice(1, -1).replace(/""/g, '"');
          }
          row.push(cell.trim());
        }
        return row.length > 0 ? row : line.split(',').map(c => c.trim());
      });
    }

    // 整形Markdownテーブル生成
    function formatMarkdown(rows, align) {
      if (!rows || rows.length === 0) return '';

      // 最大列数を求める
      let maxCols = 0;
      rows.forEach(r => { if (r.length > maxCols) maxCols = r.length; });

      // 行のセル数を均一化
      const normalizedRows = rows.map(r => {
        const row = [...r];
        while (row.length < maxCols) row.push('');
        return row;
      });

      // 各列の最大幅を算出
      const colWidths = new Array(maxCols).fill(3);
      normalizedRows.forEach(row => {
        row.forEach((cell, colIdx) => {
          const w = getVisualWidth(cell);
          if (w > colWidths[colIdx]) colWidths[colIdx] = w;
        });
      });

      // ヘッダー行
      const headerRow = normalizedRows[0];
      const headerLine = '| ' + headerRow.map((cell, idx) => {
        return padRightVisual(cell, colWidths[idx]);
      }).join(' | ') + ' |';

      // 区切り線
      const separatorLine = '| ' + colWidths.map(w => {
        if (align === 'center') return ':' + '-'.repeat(Math.max(1, w - 2)) + ':';
        if (align === 'right') return '-'.repeat(Math.max(2, w - 1)) + ':';
        return ':' + '-'.repeat(Math.max(2, w - 1));
      }).join(' | ') + ' |';

      // データ行
      const bodyLines = normalizedRows.slice(1).map(row => {
        return '| ' + row.map((cell, idx) => {
          if (align === 'center') return padCenterVisual(cell, colWidths[idx]);
          if (align === 'right') return ' '.repeat(Math.max(0, colWidths[idx] - getVisualWidth(cell))) + cell;
          return padRightVisual(cell, colWidths[idx]);
        }).join(' | ') + ' |';
      });

      return [headerLine, separatorLine, ...bodyLines].join('\n');
    }

    // CSV 生成
    function toCsv(rows) {
      return rows.map(row => {
        return row.map(c => {
          if (c.includes(',') || c.includes('"') || c.includes('\n')) {
            return `"${c.replace(/"/g, '""')}"`;
          }
          return c;
        }).join(',');
      }).join('\n');
    }

    // TSV 生成
    function toTsv(rows) {
      return rows.map(row => row.join('\t')).join('\n');
    }

    // JSON 生成
    function toJson(rows) {
      if (rows.length < 2) return '[]';
      const headers = rows[0];
      const data = rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h || `col_${idx + 1}`] = r[idx] || '';
        });
        return obj;
      });
      return JSON.stringify(data, null, 2);
    }

    // HTMLテーブルレンダリング
    function renderHtmlTable(rows) {
      if (rows.length === 0) {
        previewTable.innerHTML = '';
        return;
      }
      const headers = rows[0];
      let html = '<thead><tr>' + headers.map(h => `<th>${escapeHtml(h)}</th>`).join('') + '</tr></thead><tbody>';
      for (let i = 1; i < rows.length; i++) {
        html += '<tr>' + rows[i].map(c => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>';
      }
      html += '</tbody>';
      previewTable.innerHTML = html;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 出力全体の更新
    function updateOutputs() {
      const raw = inpTable.value;
      const rows = parseInput(raw);

      if (rows.length === 0) {
        outCode.textContent = '# データを入力すると整形された表が表示されます';
        renderHtmlTable([]);
        return;
      }

      renderHtmlTable(rows);

      if (currentTab === 'md') {
        outCode.textContent = formatMarkdown(rows, currentAlign);
        outCode.style.display = 'block';
        previewContainer.style.display = 'none';
      } else if (currentTab === 'preview') {
        outCode.style.display = 'none';
        previewContainer.style.display = 'block';
      } else if (currentTab === 'csv') {
        outCode.textContent = toCsv(rows);
        outCode.style.display = 'block';
        previewContainer.style.display = 'none';
      } else if (currentTab === 'tsv') {
        outCode.textContent = toTsv(rows);
        outCode.style.display = 'block';
        previewContainer.style.display = 'none';
      } else if (currentTab === 'json') {
        outCode.textContent = toJson(rows);
        outCode.style.display = 'block';
        previewContainer.style.display = 'none';
      }
    }

    // イベントリスナー
    inpTable.addEventListener('input', updateOutputs);

    document.querySelectorAll('.align-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.align-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentAlign = btn.dataset.align;
        updateOutputs();
      });
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        updateOutputs();
      });
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      inpTable.value = '';
      updateOutputs();
    });

    document.getElementById('btn-copy').addEventListener('click', async () => {
      const text = outCode.textContent;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        showToast('クリップボードにコピーしました！');
      } catch (e) {
        showToast('コピーに失敗しました');
      }
    });

    // クイック入力サンプルボタン
    document.getElementById('btn-sample-shabby').addEventListener('click', () => {
      inpTable.value = `| Name | Role | Location | Status |
|---|---|---|---|
| Alice | Engineering Manager | San Francisco | Active |
| Bob | Senior Backend Developer (Go/Rust) | London | On Leave |
| Charlie | UI/UX Designer | Tokyo | Active |
| Dave | QA & Release Automation Engineer | Sydney | Active |`;
      updateOutputs();
      showToast('ガタガタのMarkdown表サンプルを適用しました');
    });

    document.getElementById('btn-sample-tsv').addEventListener('click', () => {
      inpTable.value = `Product ID\tTitle\tPrice\tIn Stock\tRating
SKU-1092\tMechanical Keyboard RGB\t$129.99\tYes\t4.8
SKU-3301\tErgonomic Wireless Mouse\t$79.50\tYes\t4.6
SKU-8820\tUSB-C 4K 144Hz Monitor 27-inch\t$449.00\tNo\t4.9`;
      updateOutputs();
      showToast('スプレッドシート(TSV)サンプルを適用しました');
    });

    document.getElementById('btn-sample-csv').addEventListener('click', () => {
      inpTable.value = `Plan Name,Monthly Price,Storage,Bandwidth,Support SLA
Starter,$19,50 GB,500 GB,24h email
Pro,$49,200 GB,2 TB,4h priority
Enterprise,$199,Unlimited,Unlimited,1h phone & Slack`;
      updateOutputs();
      showToast('カンマ区切り(CSV)サンプルを適用しました');
    });

    // 外部サンプルのロード
    async function loadSample() {
      try {
        const res = await fetch('sample.md?t=' + Date.now());
        if (res.ok) {
          const text = await res.text();
          inpTable.value = text;
          updateOutputs();
          showToast('外部サンプル (sample.md) をロードしました');
        }
      } catch (err) {
        console.error('Error fetching sample.md:', err);
      }
    }

    document.getElementById('btn-load-sample').addEventListener('click', loadSample);
    window.addEventListener('DOMContentLoaded', loadSample);
  </script>
